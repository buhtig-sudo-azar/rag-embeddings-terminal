<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Masterclass — Эмбеддинги и семантический поиск</title>

  <!-- Зависимости -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery.terminal@2.45.2/js/jquery.terminal.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/jquery.terminal@2.45.2/css/jquery.terminal.min.css" rel="stylesheet" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0e14;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #00ff41;
      font-size: 24px;
      text-shadow: 0 0 10px rgba(0,255,65,0.5);
      margin-bottom: 5px;
    }

    .header p {
      color: #556;
      font-size: 13px;
    }

    .main-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .terminal-panel {
      flex: 1;
      min-width: 450px;
      max-width: 700px;
    }

    .viz-panel {
      flex: 1;
      min-width: 380px;
      max-width: 600px;
      background: #111820;
      border: 1px solid #1a3a2a;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .viz-panel h3 {
      color: #00ff41;
      text-align: center;
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.8;
    }

    #plot3d {
      flex: 1;
      min-height: 380px;
      border-radius: 6px;
      background: #0a0e14;
    }

    .similarity-legend {
      margin-top: 10px;
      padding: 8px;
      background: #0a0e14;
      border-radius: 4px;
      font-size: 11px;
      color: #888;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .similarity-legend .high { color: #00ff41; }
    .similarity-legend .mid  { color: #ffaa00; }
    .similarity-legend .low  { color: #ff4444; }

    #terminal {
      width: 100%;
      height: 550px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,255,65,0.08);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .typing {
      color: #00ff41;
    }

    .typing::after {
      content: '█';
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>RAG Masterclass — Эмбеддинги и семантический поиск</h1>
  <p>Интерактивный терминал • Модуль 1/4 • Основы RAG</p>
</div>

<div class="main-container">
  <div class="terminal-panel">
    <div id="terminal"></div>
  </div>

  <div class="viz-panel">
    <h3>📐 3D-проекция векторного пространства</h3>
    <div id="plot3d"></div>
    <div class="similarity-legend" id="legend">
      <span class="high">█ высокое сходство (0.80–0.90)</span> — тексты про одно и то же<br>
      <span class="mid">█ среднее (0.75–0.80)</span> — одна область, разная специфика<br>
      <span class="low">█ низкое (&lt;0.75)</span> — разные темы
    </div>
  </div>
</div>

<script>
$(function () {
  // -------------------- ДАННЫЕ --------------------
  const documents = [
    "Nginx — веб-сервер для обработки HTTP-запросов",
    "Apache — HTTP-сервер для хостинга веб-сайтов",
    "Docker — платформа для контейнеризации приложений",
    "systemd — система инициализации и управления службами в Linux",
    "Рецепт классического украинского борща — густой овощной суп со свёклой, капустой и сметаной"
  ];

  const labels = ["Nginx", "Apache", "Docker", "systemd", "Борщ (суп)"];

  const coords3d = [
    {x: 2.1, y: 0.8,  z: -0.3},
    {x: 1.9, y: 0.6,  z: -0.2},
    {x: 1.5, y: 0.3,  z:  0.1},
    {x: 1.2, y: 0.1,  z:  0.3},
    {x: -1.0,y: -1.5, z:  1.8}
  ];

  const similarities = [
    {i:0, j:1, score:0.893}, {i:0, j:2, score:0.865}, {i:0, j:3, score:0.846},
    {i:0, j:4, score:0.743}, {i:1, j:2, score:0.860}, {i:1, j:3, score:0.847},
    {i:2, j:3, score:0.860}, {i:2, j:4, score:0.748}, {i:3, j:4, score:0.748}
  ];

  // -------------------- ВСПОМОГАТЕЛЬНОЕ --------------------
  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function bar(score) {
    const width = Math.floor(score * 30);
    return `${'█'.repeat(width)}`;
  }

  function update3DPlot() {
    const allX = coords3d.map(c => c.x);
    const allY = coords3d.map(c => c.y);
    const allZ = coords3d.map(c => c.z);
    const colors = ['#00ff41', '#00ff41', '#00ff41', '#00ff41', '#ff4444'];
    const sizes  = [8, 8, 8, 8, 12];

    const trace = {
      type: 'scatter3d',
      mode: 'markers+text',
      x: allX,
      y: allY,
      z: allZ,
      text: labels,
      textposition: 'top center',
      textfont: { color: '#aaa', size: 11 },
      marker: {
        color: colors,
        size: sizes,
        opacity: 0.9,
        line: { color: '#1a3a2a', width: 1 }
      },
      hoverinfo: 'text',
      hovertext: documents
    };

    const layout = {
      paper_bgcolor: '#0a0e14',
      plot_bgcolor: '#0a0e14',
      scene: {
        xaxis: { showgrid: true, gridcolor: '#1a2a1a', zeroline: false, showticklabels: false },
        yaxis: { showgrid: true, gridcolor: '#1a2a1a', zeroline: false, showticklabels: false },
        zaxis: { showgrid: true, gridcolor: '#1a2a1a', zeroline: false, showticklabels: false },
        camera: { eye: { x: 1.8, y: 1.5, z: 1.2 } }
      },
      margin: { l: 0, r: 0, t: 10, b: 30 },
      showlegend: false
    };

    Plotly.newPlot('plot3d', [trace], layout, {
      responsive: true,
      displayModeBar: false
    });
  }

  // -------------------- КОМАНДЫ --------------------
  async function cmd_demo(term) {
    term.echo('');
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ШАГ 1: ЗАГРУЗКА МОДЕЛИ');
    term.echo('  Модель: intfloat/multilingual-e5-large');
    term.echo('  Размерность: 1024 числа на текст');
    term.echo('══════════════════════════════════════════════════════');

    const barLen = 30;
    for (let i = 0; i <= barLen; i++) {
      await sleep(40);
      const filled = '█'.repeat(i);
      const empty  = '░'.repeat(barLen - i);
      const pct    = Math.round((i / barLen) * 100);
      term.set_prompt(`[${filled}${empty}] ${pct}%`);
    }
    term.set_prompt('> ');
    term.echo('[✓] Модель загружена. Размерность: 1024 числа.');
    term.echo('');

    await sleep(200);
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ШАГ 2: ТЕСТОВЫЕ ДОКУМЕНТЫ');
    term.echo('══════════════════════════════════════════════════════');
    documents.forEach((doc, i) => term.echo(`  [${i+1}] ${doc}`));
    term.echo('');

    await sleep(300);
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ШАГ 3: ЭМБЕДДИНГИ — ТЕКСТ → 1024 ЧИСЛА');
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  Всего документов: 5');
    term.echo('  Чисел в каждом:   1024');
    term.echo('  Пример: [-0.0047, 0.0069, -0.0341, -0.0376, 0.0171 ...]');
    term.echo('');
    term.echo('  Каждое число = один аспект контекста.');
    term.echo('  1024 числа = полное описание СМЫСЛА текста.');
    term.echo('');

    await sleep(300);
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ШАГ 4: КОСИНУСНОЕ СХОДСТВО');
    term.echo('  Шкала: 1.0 = одинаковые | 0.0 = совсем разное');
    term.echo('══════════════════════════════════════════════════════');

    similarities.forEach(({i, j, score}) => {
      term.echo(`  [${score.toFixed(3)}] ${bar(score)}`);
      term.echo(`  A: ${documents[i]}`);
      term.echo(`  B: ${documents[j]}`);
      term.echo('');
    });

    await sleep(300);
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ШАГ 5: СЕМАНТИЧЕСКИЙ ПОИСК');
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  Попробуем три запроса:');
    term.echo('   • про веб-сервер');
    term.echo('   • про изолированную среду');
    term.echo('   • про суп из свёклы');
    term.echo('');

    const queries = [
      "Как настроить веб-сервер для раздачи статических файлов?",
      "Как создать изолированную среду для тестирования?",
      "Какой суп можно приготовить из свёклы?"
    ];

    const searchResults = {
      0: [{idx:1, score:0.810}, {idx:0, score:0.807}, {idx:2, score:0.783}, {idx:3, score:0.776}, {idx:4, score:0.760}],
      1: [{idx:2, score:0.803}, {idx:3, score:0.784}, {idx:0, score:0.781}, {idx:1, score:0.768}, {idx:4, score:0.737}],
      2: [{idx:4, score:0.779}, {idx:2, score:0.768}, {idx:3, score:0.764}, {idx:0, score:0.748}, {idx:1, score:0.743}]
    };

    for (let qi = 0; qi < queries.length; qi++) {
      term.echo('');
      term.echo(`  ПОИСК: "${queries[qi]}"`);
      term.echo('');
      searchResults[qi].forEach(({idx, score}, rank) => {
        term.echo(`  ${rank+1}. [${score.toFixed(3)}] ${bar(score)}`);
        term.echo(`     ${documents[idx]}`);
      });
      await sleep(400);
    }

    update3DPlot();

    term.echo('');
    term.echo('══════════════════════════════════════════════════════');
    term.echo('  ВЫВОД');
    term.echo('══════════════════════════════════════════════════════');
    term.echo('');
    term.echo('1. ЭМБЕДДИНГ = 1024 числа, описывающие СМЫСЛ текста.');
    term.echo('2. КОСИНУСНОЕ СХОДСТВО = 1.0 (одинаково) ... 0.0 (разное).');
    term.echo('3. ПОИСК = запрос → вектор → сравнение → ближайшие документы.');
    term.echo('4. НА МАЛЕНЬКОМ КОРПУСЕ РЕЗУЛЬТАТ МОЖЕТ КАЗАТЬСЯ «СТРАННЫМ» — И ЭТО НОРМАЛЬНО.');
    term.echo('');
    term.echo('   Если модель на запрос про суп выдаст Nginx выше борща — это значит, что вектор супа');
    term.echo('   оказался геометрически ближе к техдокументации. Модель не знает кухню, она ');
    term.echo('   просто измеряет расстояния в пространстве эмбеддингов.');
    term.echo('');
    term.echo('СЛЕДУЮЩИЙ ШАГ: Модуль 3/4 — чанкинг (нарезка документов).');
    term.echo('');
  }

  function cmd_search(term, query) {
    if (!query) {
      term.echo('[!] Укажи запрос. Пример: search веб-сервер');
      return;
    }

    term.echo('');
    term.echo(`  ПОИСК: "${query}"`);
    term.echo('');

    const q = query.toLowerCase();
    let resultIdx = 0;

    if (q.includes('борщ') || q.includes('свёкл') || q.includes('еда') || q.includes('обед') || q.includes('суп')) {
      resultIdx = 4; // борщ/суп
    } else if (q.includes('изолир') || q.includes('контейнер')) {
      resultIdx = 2; // docker
    } else if (q.includes('систем') || q.includes('служб') || q.includes('инициал')) {
      resultIdx = 3; // systemd
    } else if (q.includes('apache') || q.includes('хостинг')) {
      resultIdx = 1; // apache
    } else if (q.includes('nginx') || q.includes('веб-сервер') || q.includes('http')) {
      resultIdx = 0; // nginx
    }

    const results = [
      {idx: resultIdx,         score: 0.81 + Math.random() * 0.05},
      {idx: (resultIdx + 1) % 5, score: 0.78 + Math.random() * 0.04},
      {idx: (resultIdx + 2) % 5, score: 0.75 + Math.random() * 0.04},
      {idx: (resultIdx + 3) % 5, score: 0.74 + Math.random() * 0.03},
      {idx: (resultIdx + 4) % 5, score: 0.73 + Math.random() * 0.03}
    ].sort((a, b) => b.score - a.score);

    results.forEach(({idx, score}, rank) => {
      term.echo(`  ${rank+1}. [${score.toFixed(3)}] ${bar(score)}`);
      term.echo(`     ${documents[idx]}`);
    });
    term.echo('');
    term.echo('  На реальной модели результаты могут быть не такими «аккуратными» —');
    term.echo('  иногда запрос про суп действительно окажется ближе к техтекстам.');
    term.echo('  Это не баг, а особенность маленького корпуса и геометрии эмбеддингов.');
    term.echo('');
  }

  function cmd_what(term) {
    term.echo('');
    term.echo('ЧТО ТАКОЕ ЭМБЕДДИНГ?');
    term.echo('');
    term.echo('ЭМБЕДДИНГ — это 1024 числа, описывающие СМЫСЛ.');
    term.echo('');
    term.echo('Как это работает:');
    term.echo('  1. Модель читает текст целиком');
    term.echo('  2. Извлекает контекст (~1024 аспекта)');
    term.echo('  3. Каждый аспект → одно число');
    term.echo('  4. 1024 числа = полное описание смысла');
    term.echo('');
  }

  function cmd_rag(term) {
    term.echo('');
    term.echo('RAG-КОНВЕЙЕР');
    term.echo('');
    term.echo('ЭТАП 1: INDEX');
    term.echo('  Документы → чанкинг → эмбеддинги → ChromaDB');
    term.echo('');
    term.echo('ЭТАП 2: RETRIEVE');
    term.echo('  Запрос → эмбеддинг → косинусное сходство → топ-3');
    term.echo('');
    term.echo('ЭТАП 3: GENERATE');
    term.echo('  Запрос + документы → LLM → ответ');
    term.echo('');
  }

  function cmd_tree(term) {
    term.echo('');
    term.echo('ФАЙЛОВАЯ СТРУКТУРА ПРОЕКТА:');
    term.echo('');
    term.echo('● ~/AI DevOps Mentor/');
    term.echo('  ├─ embedding_basics.sh');
    term.echo('  ├─ oreshnik_gen.sh');
    term.echo('  └─ oreshnik_exec.sh');
    term.echo('');
  }

  function cmd_models(term) {
    term.echo('');
    term.echo('МОДЕЛИ ЭМБЕДДИНГОВ:');
    term.echo('');
    term.echo('● ТЕКУЩАЯ:');
    term.echo('  intfloat/multilingual-e5-large');
    term.echo('  Размерность: 1024 числа');
    term.echo('  Языки: 100+ (включая русский)');
    term.echo('');
  }

  function cmd_help(term) {
    term.echo('');
    term.echo('ДОСТУПНЫЕ КОМАНДЫ:');
    term.echo('');
    term.echo('  demo          — полная демонстрация (корпус + суп + Nginx)');
    term.echo('  search ЗАПРОС — поиск по документам (суп, nginx, docker, systemd...)');
    term.echo('  what          — что такое эмбеддинг');
    term.echo('  rag           — схема RAG-конвейера');
    term.echo('  tree          — структура проекта');
    term.echo('  models        — модели эмбеддингов');
    term.echo('  clear         — очистить экран');
    term.echo('  help          — этот список');
    term.echo('');
  }

  // -------------------- ИНИЦИАЛИЗАЦИЯ --------------------
  update3DPlot();

  $('#terminal').terminal(async function (command, term) {
    const line = command.trim();
    if (!line) return;

    const parts = line.split(/\s+/);
    const cmd   = parts[0].toLowerCase();
    const args  = parts.slice(1).join(' ');

    switch (cmd) {
      case 'demo':   await cmd_demo(term); break;
      case 'search': cmd_search(term, args); break;
      case 'what':   cmd_what(term); break;
      case 'rag':    cmd_rag(term); break;
      case 'tree':   cmd_tree(term); break;
      case 'models': cmd_models(term); break;
      case 'help':   cmd_help(term); break;
      case 'clear':  term.clear(); break;
      default:
        term.echo(`[!] Неизвестная команда: ${cmd}`);
        term.echo('    Набери help для списка.');
    }
  }, {
    greetings: [
      '╔══════════════════════════════════════════╗',
      '║  RAG MASTERCLASS — МОДУЛЬ 1             ║',
      '║  Эмбеддинги и семантический поиск       ║',
      '╚══════════════════════════════════════════╝',
      '',
      '  Курс: AI-расширенные практики в DevOps',
      '  Тема 6, Модуль 1/4 — Основы RAG',
      '',
      '  Модель: intfloat/multilingual-e5-large',
      '  Вектор: 1024 числа на текст',
      '  Языки: 100+ (включая русский)',
      '',
      '  Набери demo для демонстрации.',
      '  Набери help для списка команд.',
      ''
    ].join('\n'),
    prompt: '> ',
    height: 550,
    width: '100%',
    checkArity: false,
    completion: ['demo', 'search', 'what', 'rag', 'tree', 'models', 'help', 'clear'],
    keydown: function (e) {
      if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
        this.clear();
        return false;
      }
    }
  });
});
</script>

</body>
</html>
